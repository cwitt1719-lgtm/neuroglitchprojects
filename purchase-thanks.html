<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Thank you | Neuro-Glitch Projects</title>
  <meta property="og:title" content="Neuro-Glitch Projects">

  <style>
    :root { --bg:#07060f; --card:#120c1c; --line:#3a2458; --text:#F4F7FB; --muted:#c4b6d8; --cyan:#2ee7ff; --purple:#b44cff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(circle at top, #1a1030 0%, var(--bg) 42%); color:var(--text); line-height:1.5; }
    header, main { width:min(880px, calc(100% - 32px)); margin:0 auto; }
    header { padding:12px 0 0; display:flex; align-items:center; }
    .brand { height:52px; width:auto; display:block; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin:28px 0; }
    h1 { font-size:clamp(28px, 6vw, 42px); line-height:1.1; margin:0 0 12px; }
    p { color:var(--muted); font-size:18px; margin:10px 0; }
    a { color:var(--cyan); }
    .buy { display:inline-block; margin-top:12px; background:linear-gradient(90deg, var(--purple), var(--cyan)); color:#071018; text-decoration:none; font-weight:700; border-radius:999px; padding:10px 16px; }
  </style>
</head>
<body>
  <header><a href="/"><img class="brand" src="logo.jpg?v=10" alt="Neuro-Glitch. We are different, not less."></a></header>

    <div class="card">

      <a class="buy" href="/">Back to Neuro-Glitch Projects</a>
    </div>
  </main>
</body>
</html>
